version: '3.9'

services:
  mongo:
    image: mongo:7
    container_name: recoverx-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: recoverx
    volumes:
      - mongo_data:/data/db

  backend:
    build:
      context: ./backend
    container_name: recoverx-backend
    depends_on:
      - mongo
    ports:
      - "8000:8000"
    environment:
      MONGO_URI: mongodb://mongo:27017
      MONGO_DB: recoverx
      JWT_SECRET: change-me-in-production
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  mongo_data:
